services:
  postgres:
    image: postgres:16
    container_name: postgres

    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: orbital
    
    ports:
      - "5432:5432"

    volumes:
      - orbital:/var/lib/postgresql/data

  migrate: 
    image: migrate/migrate

    volumes:
      - ./migrations:/migrations

    depends_on:
      - postgres

    command: "-path=/migrations -database='postgres://user:password@postgres:5432/orbital?sslmode=disable' up"

volumes:
  orbital: